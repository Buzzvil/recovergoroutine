name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.27.1', '1.27.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build -o /tmp/recovergoroutine .
      - run: /tmp/recovergoroutine -help
      - run: go build -buildmode=plugin -o /tmp/recovergoroutine.so ./plugin
