name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.27.1', '1.27.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build -o /tmp/recovergoroutine .
      - run: /tmp/recovergoroutine -help
      - run: go build -buildmode=plugin -o /tmp/recovergoroutine.so ./plugin
